[project]
name = "atestservice"
version = "0.1.0"
description = "Phone Agent Cloud Server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "websockets>=12.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
]

[project.scripts]
atestservice = "atestservice.main:main"

[dependency-groups]
dev = []
llm-local = [
    "opencv-python>=4.8.0",
    "numpy>=1.26.0",
    "uiautomator2>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atestservice = ["case_preparation/prompts/*.md", "exploration/prompts/*.md", "script_generation/prompts/*.md", "script_generation/profiles/*.md"]

[tool.setuptools.exclude-package-data]
"*" = ["config.ini", "models.ini", "*.local.*"]

[tool.uv]
package = true
